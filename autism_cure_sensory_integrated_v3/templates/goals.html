{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>🎯 Goals</h2><form method="post"><input name="title" placeholder="One small measurable goal" required><input name="domain" placeholder="Domain e.g. communication"><input type="number" name="baseline" placeholder="Baseline %"><input type="number" name="target" value="100" placeholder="Target %"><input type="number" name="current" placeholder="Current %"><button class="btn">Add goal</button></form></div><div class="grid">{% for g in goals %}<div class="card"><h3>{{g['title']}}</h3><small>{{g['domain']}}</small><div class="bar"><i style="width:{{g['current'] if g['current']<100 else 100}}%"></i></div><p>{{g['current']}}% current • {{g['target']}}% target</p></div>{% endfor %}</div>{% endblock %}
