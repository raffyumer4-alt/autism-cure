{% extends 'base.html' %}{% block content %}<div class="formbox wide"><h2>Build the patient profile</h2><p>Use “support needs” rather than a disease stage. Select what best describes current support needs.</p><form method="post"><input name="patient_name" placeholder="Patient name" required><label>Date of birth</label><input type="date" name="dob"><input type="number" min="1" name="age" placeholder="Age"><select name="support_level"><option>Level 1 — needs support</option><option>Level 2 — needs substantial support</option><option>Level 3 — needs very substantial support</option><option>Not sure / prefer not to say</option></select><select name="diagnosis_status"><option>Diagnosed autism</option><option>Under evaluation</option><option>Not formally diagnosed</option></select><select name="communication_level"><option>Speaks in sentences</option><option>Uses short phrases</option><option>Uses single words</option><option>Mostly non-speaking / AAC / gestures</option><option>Other</option></select><textarea name="sensory_notes" placeholder="Sensory preferences, triggers, calming tools"></textarea><textarea name="strengths" placeholder="Interests, strengths, things they enjoy"></textarea><textarea name="goals" placeholder="Top 3 goals"></textarea><button class="btn">Create patient space</button></form></div>{% endblock %}
