{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>🏃 Movement</h2><p>Keep it safe, enjoyable and adapted to the person’s ability.</p><form method="post"><input name="activity" placeholder="Movement activity" required><input type="number" name="minutes" min="0" placeholder="Minutes"><label><input type="checkbox" name="completed" value="1"> Completed</label><textarea name="note" placeholder="How did it feel?"></textarea><button class="btn">Log movement</button></form></div><div class="card">{% for r in rows %}<div class="row"><b>{{r['log_date']}}</b><span>{{r['activity']}} • {{r['minutes']}} min</span></div>{% endfor %}</div>{% endblock %}
