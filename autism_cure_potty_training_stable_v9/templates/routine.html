{% extends 'base.html' %}{% block content %}<div class="formbox wide"><h2>🗓️ Today’s visual routine — {{p['name']}}</h2><form method="post"><textarea name="morning" placeholder="Morning">{{r['morning'] if r else ''}}</textarea><textarea name="afternoon" placeholder="Afternoon">{{r['afternoon'] if r else ''}}</textarea><textarea name="evening" placeholder="Evening">{{r['evening'] if r else ''}}</textarea><label><input type="checkbox" name="completed" value="1" {% if r and r['completed'] %}checked{% endif %}> Today’s routine mostly completed</label><textarea name="note" placeholder="What helped today?">{{r['note'] if r else ''}}</textarea><button class="btn">Save routine</button></form></div>{% endblock %}
