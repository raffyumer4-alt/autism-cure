{% extends "base.html" %}{% block content %}
<div class="card"><div class="eyebrow">STEP 2 • PATIENT PROFILE</div><h1>Build the patient's starting plan</h1>
<p>Use the information you know. A clinician can provide a formal assessment; the app does not diagnose.</p>
<form method="post" class="formgrid">
<label>Patient name<input name="patient_name" required></label><label>Age (years)<input name="age" type="number" min="1" max="120"></label>
<label>Date of birth<input name="dob" type="date"></label><label>Support needs<select name="support_level"><option>Not yet assessed</option><option>Level 1 — requires support</option><option>Level 2 — requires substantial support</option><option>Level 3 — requires very substantial support</option></select></label>
<label>Diagnosis status<select name="diagnosis_status"><option>Diagnosed ASD</option><option>Awaiting professional assessment</option><option>Developmental concerns</option><option>Other / not sure</option></select></label>
<label>Communication level<select name="communication_level"><option>Non-speaking / emerging communication</option><option>Single words / short phrases</option><option>Conversational</option><option>Advanced / age-appropriate</option><option>Not sure</option></select></label>
<label class="full">Sensory notes<textarea name="sensory_notes" placeholder="Triggers, preferences, sounds/textures to consider"></textarea></label>
<label class="full">Strengths<textarea name="strengths" placeholder="Interests, favorite activities, things the patient does well"></textarea></label>
<label class="full">Main goals<textarea name="goals" placeholder="Examples: requesting, eye gaze, turn taking, dressing, attention"></textarea></label>
<button class="btn">Create Patient Plan</button></form></div>{% endblock %}
