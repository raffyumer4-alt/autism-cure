{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>📅 Appointments</h2><form method="post"><input type="date" name="appt_date" required><input name="provider" placeholder="Doctor / therapist / school"><input name="purpose" placeholder="Purpose"><textarea name="note" placeholder="Questions to ask"></textarea><button class="btn">Save appointment</button></form></div><div class="card">{% for r in rows %}<div class="row"><b>{{r['appt_date']}}</b><span>{{r['provider']}} • {{r['purpose']}}</span><small>{{r['note']}}</small></div>{% endfor %}</div>{% endblock %}
