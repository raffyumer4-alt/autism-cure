{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>🍎 Food & hydration</h2><form method="post"><textarea name="meals" placeholder="Meals / snacks"> </textarea><select name="appetite"><option>Good</option><option>Okay</option><option>Low</option><option>Varied</option></select><input name="water" placeholder="Approx water / fluids"><textarea name="note" placeholder="Preferences / observations"></textarea><button class="btn">Log today</button></form></div><div class="card"><h3>Recent logs</h3>{% for r in rows %}<div class="row"><b>{{r['log_date']}}</b><span>{{r['appetite']}}</span><small>{{r['meals']}}</small></div>{% endfor %}</div>{% endblock %}
