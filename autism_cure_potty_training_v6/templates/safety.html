{% extends 'base.html' %}{% block content %}<div class="formbox wide"><h2>🛟 Safety & calm plan</h2><p>Use this as a family planning tool. For immediate danger or a medical emergency, contact local emergency services.</p><form method="post"><textarea name="calm_steps" placeholder="Calm steps: quiet place, preferred item, visual break, trusted person">{{s['calm_steps'] if s else ''}}</textarea><textarea name="contacts" placeholder="Trusted contacts">{{s['contacts'] if s else ''}}</textarea><textarea name="notes" placeholder="Important safety notes">{{s['notes'] if s else ''}}</textarea><button class="btn">Save plan</button></form></div>{% endblock %}
