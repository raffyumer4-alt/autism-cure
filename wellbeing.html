{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>🌤️ Wellbeing check-in</h2><form method="post"><select name="mood"><option>Calm</option><option>Happy</option><option>Okay</option><option>Upset</option><option>Overwhelmed</option></select><select name="energy"><option>High</option><option>Medium</option><option>Low</option></select><input type="number" step="0.5" name="sleep_hours" placeholder="Sleep hours"><select name="stress"><option>Low</option><option>Medium</option><option>High</option></select><textarea name="note" placeholder="Optional note"></textarea><button class="btn">Save check-in</button></form></div><div class="card">{% for r in rows %}<div class="row"><b>{{r['log_date']}}</b><span>{{r['mood']}} • {{r['energy']}} • {{r['sleep_hours']}}h</span></div>{% endfor %}</div>{% endblock %}
